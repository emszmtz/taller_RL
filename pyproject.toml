[project]
name = "rl-trader"
version = "0.1.0"
description = "Taller de RL (MIAX-14): agente de trading tabular con Q-learning y Sarsa"
requires-python = ">=3.10"
dependencies = [
    "gymnasium>=1.0",
    "numpy",
    "pandas",
    "matplotlib",
    "seaborn",
    "tqdm",
    "requests",
    "python-dotenv",
]

[project.optional-dependencies]
notebooks = ["jupyter", "ipykernel"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["rl_trader"]
